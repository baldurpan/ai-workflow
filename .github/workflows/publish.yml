name: Publish

on:
  release:
    types: [published]

permissions:
  id-token: write # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    if: github.event.release.draft == false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npm test -w @baldurpan/create-ai-workflow
      - run: npm run build -w @baldurpan/create-ai-workflow

      - name: Publish stable
        if: github.event.release.prerelease == false
        run: npm publish -w @baldurpan/create-ai-workflow

      - name: Publish prerelease
        if: github.event.release.prerelease == true
        run: npm publish -w @baldurpan/create-ai-workflow --tag next
