# Asks one question, on every push to `main`: is there a package change sitting on `main` that nobody
# wrote a note for?
#
# It compares against the LAST RELEASE TAG, not against a branch point, because this repository does not
# use pull requests — work lands directly on `main`, so there is no branch for a note check to stand on and
# no pre-merge moment to run it in. The question that survives without branches is the one that actually
# matters at release time: since the last release, does everything that changed the package have a note?
#
# The failure it exists to catch is quiet and gets quieter the longer it sits. Land a package change with
# no note; land two more with notes; release. `changeset:prepare-release` bumps the version and writes a
# CHANGELOG that describes the two and not the first. The code ships either way. Nothing is red, and the
# missing entry is discoverable only by someone reading the changelog against the diff.
#
# So a red run here does not mean anything is broken — it means a note is owed for something already
# landed. Write it and push; the next run is green. It is a standing reminder, not a gate, and it cannot be
# a gate in a repository with nothing to gate.
#
# ONE COMMIT IS EXEMPT, AND IT IS THE RELEASE ITSELF. There, `changeset:prepare-release` has consumed every
# note into the CHANGELOG and moved the version, so the question below — are there pending notes? — reads a
# changed package with nothing pending and calls it a missing note, on the one push least likely to have
# one. The tag that would make it green is cut by publish.yml minutes later, after the npm publish, so this
# is not a race that usually lands the right way: unguarded, this file is red on every release until
# something unrelated is pushed.
#
# The guard is the version moving, which is exactly what publish.yml gates on — the repository already
# knows how to say "this is a release" and this was the one place asking without it. It matters more than
# a red square: a check that cannot tell a release from a forgotten note teaches whoever hits it to write
# an EMPTY note to get past the note check, and a mechanism whose own gate is satisfied by a lie stops
# being worth having.
#
# What it runs is `changeset:status`, which REPORTS and writes nothing: it never moves a version, never
# tags, never deletes a note. The script that consumes notes is `changeset:prepare-release`, and nothing in
# CI calls it — releasing is a human act, and publish.yml only notices that you performed it. Do not add it
# here.
#
# Two things worth knowing before debugging a surprising pass. It reads TRACKED changes only, `git diff`
# being its input, which is why a local run against an uncommitted tree reports nothing and means nothing.
# And its file matching does not include dotfiles, because `changedFilePatterns` defaults to `**` and `**`
# does not match a leading dot.

name: Release note

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-note
  cancel-in-progress: true

jobs:
  changeset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # fetch-depth: 0 AND the tags: the whole point is to resolve the last release tag and diff against
      # it, and a default depth-1 checkout has neither the tag nor the history to reach it.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Is anything on main missing its note?
        shell: bash
        run: |
          set -euo pipefail

          # The release that is already out. Without one — a fresh repository, or tags not fetched — there
          # is no meaningful "since", and reporting against the root commit would flag the entire history.
          SINCE=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || true)
          if [[ -z "$SINCE" ]]; then
            echo "No release tag to compare against — nothing to ask." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "Comparing \`main\` against \`$SINCE\`." >> "$GITHUB_STEP_SUMMARY"

          # The release commit — see the header. The notes are gone because they became the CHANGELOG, and
          # the version moving is what says so.
          MANIFEST=packages/create-ai-workflow/package.json
          AT_TAG=$(git show "$SINCE:$MANIFEST" 2>/dev/null \
            | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>{try{process.stdout.write(JSON.parse(d).version||"")}catch{}})' \
            || true)
          NOW=$(node -p "require('./$MANIFEST').version")
          if [[ -n "$AT_TAG" && "$AT_TAG" != "$NOW" ]]; then
            echo "Version moved \`$AT_TAG\` → \`$NOW\` since \`$SINCE\` — this push is the release, and its notes are in the CHANGELOG." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # `--since` is passed here rather than taken from the script, because the script's own default is
          # `origin/main` — the right answer for a branch and the wrong one on main, where it compares HEAD
          # against itself and always passes.
          if npx changeset status --since="$SINCE"; then
            echo "Every package change since \`$SINCE\` has a note." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo
              echo "**A package changed since \`$SINCE\` with no release note.**"
              echo
              echo "Write one file in \`.changeset/\` describing it — see \`CLAUDE.md\`. Nothing is broken"
              echo "and nothing is blocked; the cost of leaving it is a release whose changelog is missing"
              echo "an entry for code it ships."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
